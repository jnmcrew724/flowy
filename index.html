<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Flowy</title>
<meta name="description" content="A tiny personal workflow status tracker.">
<meta name="theme-color" content="#f7f3ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon-128.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flowy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ec; --card:#fdfbf7; --field:#f1ebdf; --cream:#e8dfc9;
    --border:#ddd5c5; --border2:#cfc6b4; --ink:#241f1a; --muted:#8c8272;
    --muted2:#6b6355; --handle:#bdb3a0; --done-name:#5a6b5f;
    --coral:#e05a3a; --amber:#d8a03c; --green:#2e9e6b; --done:#3f7d5a; --remove:#a8503f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#eae4d8;color:var(--ink);
    font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  input::placeholder{color:#a89f8f}
  .msr{
    font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;
    line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;
    white-space:nowrap;word-wrap:normal;direction:ltr;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  }
  @keyframes flowFall{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(980px) rotate(560deg)}}
  @keyframes flowPop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}

  #app{
    position:relative;height:100%;min-height:100dvh;display:flex;flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg,#f6e3d8 0%,var(--paper) 24%);
  }

  .brand{display:flex;align-items:center;gap:9px;
    padding:calc(env(safe-area-inset-top) + 14px) 24px 0;flex:0 0 auto}
  .brand img{width:26px;height:26px;flex:0 0 auto;display:block}
  .brand span{font-family:'Source Serif 4',serif;font-size:1.2rem;font-weight:600;font-style:italic;letter-spacing:-0.01em}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;flex:0 0 auto;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.68rem;
    letter-spacing:0.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .chip.active{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
  .chip.inactive{background:var(--card);color:var(--muted2);border:1px solid var(--border)}
  .chip.add{font-family:'Instrument Sans',sans-serif;font-size:0.85rem;color:var(--muted);
    background:transparent;border:1px dashed var(--border2);padding:8px 12px}
  .chip.manage{font-family:'Instrument Sans',sans-serif;font-size:1rem;line-height:0.7;color:var(--muted2);
    background:var(--card);border:1px solid var(--border);padding:6px 12px}

  /* Manage-workflows sheet */
  .sheet-backdrop{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end;
    background:rgba(36,31,26,0.32);animation:flowPop 0.14s ease-out;-webkit-tap-highlight-color:transparent}
  .sheet{background:var(--paper);border-radius:18px 18px 0 0;border-top:1px solid var(--border);
    padding:18px 20px calc(env(safe-area-inset-bottom) + 16px);max-height:78%;display:flex;flex-direction:column;
    box-shadow:0 -12px 40px rgba(36,31,26,0.18)}
  .sheet-title{font-family:'Source Serif 4',serif;font-size:1.35rem;font-weight:600;letter-spacing:-0.01em}
  .sheet-sub{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.07em;
    text-transform:uppercase;color:var(--muted);margin-top:5px}
  .sheet-note{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.04em;
    color:var(--remove);margin-top:10px;background:#f6e7e2;border:1px solid #e6cfc7;border-radius:8px;padding:8px 10px}
  .sheet-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:14px 0 6px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .wfrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:6px 8px}
  .wfrow.current{border-color:var(--border2);background:var(--cream)}
  .pin{width:44px;height:44px;flex:0 0 auto;border-radius:8px;background:var(--field);border:1px solid var(--border);
    cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .pin .msr{font-size:21px;color:var(--handle);transform:rotate(45deg)}
  .pin.on{background:var(--ink);border-color:var(--ink)}
  .pin.on .msr{color:var(--paper);transform:none;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
  .wfrow-name{flex:1;min-width:0;background:none;border:none;text-align:left;cursor:pointer;padding:6px 4px;
    display:flex;flex-direction:column;gap:2px;-webkit-tap-highlight-color:transparent}
  .wfrow-title{font-family:'Source Serif 4',serif;font-size:1.05rem;font-weight:600;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wfrow-meta{font-family:'IBM Plex Mono',monospace;font-size:0.58rem;font-weight:600;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--muted)}
  .sheet-done{width:100%;margin-top:6px;flex:0 0 auto}

  .header{padding:20px 24px 2px;flex:0 0 auto}
  .wfname{font-family:'Source Serif 4',serif;font-size:1.75rem;font-weight:600;letter-spacing:-0.01em;margin:0}
  .wfname-input{font-family:'Source Serif 4',serif;font-size:1.5rem;font-weight:600;color:var(--ink);
    background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:100%;outline:none}
  .subline{font-family:'IBM Plex Mono',monospace;font-size:0.65rem;font-weight:600;letter-spacing:0.08em;
    color:var(--muted);margin-top:7px;text-transform:uppercase;
    border-top:2px solid;border-image:linear-gradient(90deg,#e05a3a,#d8a03c,#2e9e6b) 1;padding-top:8px}
  .subline.done{color:var(--done)}

  .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:14px 20px 10px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  .step{display:flex;align-items:center;gap:14px;cursor:pointer;padding:13px 16px;border-radius:10px;
    color:var(--ink);min-height:66px;text-align:left;flex:0 0 auto;width:100%;
    transition:transform 0.08s,background 0.25s;-webkit-tap-highlight-color:transparent}
  .step:active{transform:translateY(1px)}
  .step .ic{width:42px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .step .ic .msr{font-size:23px;color:var(--card)}
  .step .nm{flex:1;font-family:'Source Serif 4',serif;font-size:1.1rem;font-weight:600}
  .step .tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.07em;white-space:nowrap}

  .erow{border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .erow-top{display:flex;align-items:center;gap:8px}
  .drag{cursor:grab;touch-action:none;font-size:1.05rem;color:var(--handle);padding:6px 4px;user-select:none}
  .icbtn{background:var(--field);border:1px solid var(--border);border-radius:8px;width:44px;height:44px;
    cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .icbtn .msr{font-size:21px;color:var(--muted2)}
  .nameinput{flex:1;min-width:0;background:var(--field);border:1px solid transparent;border-radius:8px;
    padding:11px 12px;color:var(--ink);font-family:'Source Serif 4',serif;font-weight:600;font-size:16px;outline:none}
  .nameinput:focus{border-color:var(--ink)}
  .rm{background:none;border:none;color:var(--remove);font-size:1.05rem;cursor:pointer;padding:6px 4px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;animation:flowPop 0.15s ease-out}
  .gcell{border-radius:6px;padding:7px 0;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .gcell .msr{font-size:19px;color:var(--muted2)}
  .delwf{background:none;border:none;color:var(--muted);font-family:'IBM Plex Mono',monospace;
    font-size:0.65rem;font-weight:600;letter-spacing:0.07em;cursor:pointer;padding:8px}

  .footer{display:flex;gap:10px;padding:10px 20px calc(env(safe-area-inset-bottom) + 12px);flex:0 0 auto}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;letter-spacing:0.06em;
    text-transform:uppercase;padding:13px 20px;border-radius:8px;cursor:pointer;transition:transform 0.08s;
    -webkit-tap-highlight-color:transparent}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{color:var(--ink);background:transparent;border:1px solid var(--border2)}
  .btn.solid{color:var(--paper);background:var(--ink);border:1px solid var(--ink)}
  .btn.grow{flex:1}

  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .confetti i{position:absolute;top:-24px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
